[package]
name = "elkia-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
elkia-net = { path = "../elkia-net" }
tokio = { version = "1.36", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.5", features = ["derive", "env"] }
uuid = { version = "1.21.0", features = ["v4"] }
rand = "0.10.0"
async-trait = "0.1.89"
