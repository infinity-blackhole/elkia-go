[package]
name = "elkia-world"
version = "0.1.0"
edition = "2021"

[dependencies]
elkia-net = { path = "../elkia-net" }
tokio = { version = "1.36", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
bytes = "1.5"
log = "0.4"
env_logger = "0.10"
clap = { version = "4.4", features = ["derive", "env"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.0", features = ["v4"] }


